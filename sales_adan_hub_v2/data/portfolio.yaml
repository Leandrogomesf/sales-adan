      - id: propensity-score-tree
        name: Propensity Score (Árvore de Decisão)
        operational_status: Test
        phase_since: "2026-05"
        last_run: "2026-11-17"
        last_training: "2026-11-17"
        registered_model:
          name: "ml_model_propensity_score"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.ml_model_propensity_score"
          champion_version: 20
          challenger_version: null
          latest_version: 20
        functional:
          problem_solved: >-
            Estima a probabilidade de compra de um produto por um PDV em um
            período futuro, permitindo diferenciar oportunidades com maior ou
            menor chance de conversão.
          decision_supported: >-
            Priorizar oportunidades comerciais por combinação cliente-produto,
            apoiando a seleção de ofertas, o Portfolio Segmentation e outros
            mecanismos de priorização comercial.
          users: [Trade, Digital Sales, Growth]
          granularity: "Cliente-Produto"
          update_frequency: "Não disponível"
          plain_explanation: >-
            Enquanto o Affinity Score responde quanto um produto combina com o
            perfil do PDV, o Propensity Score estima a chance de compra desse
            produto pelo cliente no horizonte definido pelo modelo. O score
            ajuda a concentrar esforço comercial nas oportunidades com maior
            probabilidade estimada de conversão.
          known_limitations: >-
            O experimento selecionado prioriza Recall relativamente à maximização
            de Precisão, buscando capturar maior parcela das oportunidades
            potenciais. Isso implica aceitar uma quantidade maior de falsos
            positivos em troca de reduzir oportunidades relevantes não
            identificadas. O horizonte exato associado à probabilidade ainda
            precisa ser explicitado na documentação.
        technical:
          pipeline: >-
            Feature Store → Tratamento de missings e outliers
            (capping 1%-99%) → Seleção/redução de features →
            Controle de colinearidade (>0.9) → Tratamento de desbalanceamento →
            Decision Tree → Propensity Score → Classificação/priorização downstream
          model: >-
            Decision Tree (experimento 2.3 / script v2.3), selecionada a partir
            de comparação com alternativas como Logistic Regression e
            Random Forest.
          model_diagram: "4_arvore_propensao.png"
          target: "Probabilidade estimada de compra (0-1) de um produto por um PDV"
          observation_window: "Até 365 dias (janela de recência)"
          prediction_window: "Próximo período (não especificado em dias neste documento)"
          main_features:
            - "RecenciaProduto (recência de compra do produto)"
            - "NetSales / NetSalesProduto"
            - "Cluster (CC V2) e BairroCode"
          validation_strategy: "Mais de 23 milhões de modelos customizados (combinação PDV x Produto), métricas médias por experimento"
          calibration_method: "Não disponível"
          postprocessing_rules: >-
            Missings de variáveis transacionais tratados como valor máximo da
            janela (nunca comprou); missings categóricos rotulados como
            "Desconhecido"
          retraining_frequency: "Não disponível"
        output_table:
          name: "propensity_score_predictions (métricas em metrics_propensity_score)"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.propensity_score_predictions"
