  - id: cross-sell-intelligence
    name: Cross-sell Dashboard
    code: "PS 2.5 · FP-Growth"
    phase: mvp
    operational_status: Live
    dashboard_url: "https://adb-1341635366377882.2.azuredatabricks.net/dashboardsv3/01f1ae22f97e118aa644ed8354945821/published?o=1341635366377882&view=fullscreen"
    module: Produto
    consuming_areas: [CRM, Trade, Digital Sales, Marketing, Sales, Growth]
    business_owner: Leandro Ferreira (DPM)
    technical_owner: Leandro Ferreira (DPM)
    description: >-
      Dashboard de análise de cross-sell entre marcas (market basket
      analysis), com camada de IA conversacional (Genie) para consultas em
      linguagem natural sobre regras de associação de compra.
    business_objective: >-
      Identificar quais marcas os clientes tendem a comprar em conjunto,
      para apoiar decisões de expansão de mix e cross-sell por PDV ou por
      estado.
    tables:
      - "Cross sell Score Brasil (uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.cross_sell_br)"
      - "Cross sell Score UF (uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.cross_sell_states)"
      - "Cross sell Score Customer (uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.cross_sell_customer)"
    consumption: [Dashboard, "IA Conversacional (Genie)"]
    source_docs:
      - "Não Disponível"
    algorithms:
      - id: cross-sell-fpgrowth
        name: Cross-sell (FP-Growth)
        operational_status: Live
        phase_since: "2026-08"
        last_run: "Não disponível"
        last_training: "Não disponível"
        functional:
          problem_solved: >-
            Identifica padrões recorrentes de compra conjunta entre marcas,
            permitindo entender quais combinações aparecem com frequência acima
            da esperada nas cestas dos clientes.
          decision_supported: >-
            Quais marcas ou combinações devem ser exploradas em estratégias de
            expansão de mix e cross-sell em nível nacional ou estadual.
          users: [CRM, Trade, Marketing, "Growth / Analytics"]
          granularity: "Regra de associação entre marcas (nacional ou por estado)"
          update_frequency: "Não disponível neste documento"
          plain_explanation: >-
            O algoritmo analisa o histórico de compras de muitos clientes e
            encontra padrões do tipo "clientes que compram X também costumam
            comprar Y". O resultado representa um padrão agregado da população,
            e não uma previsão de compra individual para determinado PDV.
          known_limitations: >-
            O resultado depende da janela histórica utilizada e pode não refletir
            integralmente sazonalidades de longo prazo ou lançamentos recentes.
            Regras calculadas sobre populações pequenas, principalmente em UFs
            com menor número de clientes elegíveis, exigem maior cautela na
            interpretação.
        technical:
          pipeline: >-
            Histórico de pedidos (SAP/BEES) →
            Construção das cestas de compra →
            Market Basket Analysis →
            FP-Growth →
            Regras de associação →
            Aplicação dos critérios de suporte/associação →
            Resultados nacional e por estado →
            cross_sell_br / cross_sell_states
          model: "FP-Growth (Market Basket Analysis)"
          model_diagram: "7_fpgrowth_associacao.png"
          target: >-
            Regras de associação antecedente(s) → consequente(s).
            Não existe target supervisionado equivalente ao de um modelo
            tradicional de classificação.
          observation_window: "Janela de meses recente (não especificada em dias neste documento)"
          prediction_window: "Não aplicável (padrão agregado, não previsão individual)"
          main_features: ["Marca(s) antecedente(s)", "Marca(s) consequente(s)", "Estado do cliente (CustomerState), na versão por estado"]
          validation_strategy: "Não disponível neste documento"
          calibration_method: >-
            min_support calculado separadamente por estado (min_support_used)
            — compensa a diferença de volume de clientes entre estados
          postprocessing_rules: "Filtro de lift > 1 aplicado na geração dos dados (toda regra publicada já tem associação real, não coincidência)"
          retraining_frequency: "Não disponível"
        output_table:
          name: "cross_sell_br / cross_sell_states"
          unity_catalog_path: "uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.cross_sell_br"
          columns:
            - {name: antecedents, type: string, description: "Marca(s) de partida da regra", example: "DORITOS"}
            - {name: consequents, type: string, description: "Marca(s) sugerida(s)", example: "RUFFLES"}
            - {name: support, type: decimal, description: "% de clientes que compram ambos, sobre o total da base", example: "0.12"}
            - {name: confidence, type: decimal, description: "De quem compra o antecedente, % que também compra o consequente", example: "0.91"}
            - {name: lift, type: decimal, description: "Quanto a combinação ocorre mais do que o esperado pelo acaso (>1 = associação real)", example: "1.12"}
            - {name: kulczynski, type: decimal, description: "Confidence corrigida para reduzir viés de marcas muito populares", example: "0.78"}
            - {name: certainty, type: decimal, description: "Quão mais confiável a regra é do que simplesmente chutar o consequente", example: "0.55"}
            - {name: CustomerState, type: string, description: "Estado do cliente (somente em cross_sell_states)", example: "SP"}
            - {name: n_customers, type: int, description: "Clientes daquele estado na análise (somente em cross_sell_states) — indicador de robustez", example: "4210"}
        technical_metrics:
          model_performance:
            - "Exemplo real: Doritos → Ruffles, confiança 91%"
            - "Exemplo real: Cheetos → Fandangos, lift 1,12"
            - "Toda regra publicada tem lift > 1 (filtro de geração)"
          coverage: "Nacional (cross_sell_br) e por estado (cross_sell_states, sujeito a min_support por UF)"
          operational_quality: "Estados sem RAC ou com poucos clientes podem não aparecer em cross_sell_states (descartados por não atingirem base mínima)"
          drift_stability: "Não disponível neste documento"
        business_value:
          note: >-
            Regras com n_customers baixo são menos confiáveis — sinalizar isso
            em decisões de negócio, mesmo com lift alto.
          metrics: ["Penetração de portfólio", "Expansão de mix", "Completude de ofertas"]

