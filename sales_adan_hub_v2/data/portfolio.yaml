  - id: target-intelligence
    name: Metas (Target Intelligence)
    code: "MT 8.1"
    phase: poc
    operational_status: WIP
    module: Vendedor
    consuming_areas: [DTS, Sales Intelligence, Trade]
    business_owner: Thiago Ardito
    technical_owner: Leonardo Damasio (DS Lead)
    description: >-
      Cálculo das metas do próximo período a partir do potencial real de
      venda do PDV, combinando os outputs dos demais algoritmos do Sales
      ADAN em um modelo de build-up bottom-up.
    business_objective: >-
      Maximizar a acurácia da distribuição de metas a partir do potencial
      real de venda do PDV, sem penalizar a remuneração variável dos
      vendedores nem automatizar o processo atual na v1.
    tables:
      - "Não Disponível"
    consumption: [Databricks SQL]
    source_docs:
      - "Não Disponível"
    algorithms:
      - id: goals-potential-model
        name: Modelo de Potencial de PDV (Build-up Bottom-up)
        operational_status: WIP
        phase_since: "2026-12"
        last_run: "Não disponível (ainda não produtivo)"
        last_training: "Não disponível"
        functional:
          problem_solved: >-
            Evoluir a distribuição de metas comerciais atualmente baseada em
            médias e etapas manuais, incorporando estimativas de potencial mais
            aderentes à realidade de PDVs e rotas, especialmente em cenários
            voláteis ou com histórico limitado.
          decision_supported: >-
            Qual potencial/meta associar a PDVs e rotas como referência para
            o processo de cascateamento, permitindo comparar uma abordagem
            bottom-up com o processo atualmente utilizado.
          users: ["Gestor DTS", "Vendedor DTS/OT", "Time de Sales Intelligence"]
          granularity: "PDV / Rota"
          update_frequency: "Ciclo de cascateamento (OT: 6 meses | DTS: 3 meses + sazonalidade 70/30)"
          plain_explanation: >-
            Em vez de depender somente da distribuição top-down da meta, a
            proposta estima o potencial a partir da realidade dos PDVs e rotas
            e constrói uma visão de baixo para cima. Na primeira versão, essa
            estimativa funciona como challenger e referência comparativa, sem
            substituir automaticamente o processo oficial.
          known_limitations: >-
            Em fase de PoC: a abordagem é explicitamente champion-challenger e
            não automatiza nem substitui o cascateamento atual. O modelo ainda
            depende de validação estatística, qualidade das fontes, regras de
            cold start e alinhamento das regras de reconciliação com as metas
            corporativas.
        technical:
          pipeline: >-
            Data Contracts (schema + owner + SLA por fonte) →
            Construção das séries históricas →
            ARIMA/SARIMA como hipótese de forecast H1 →
            Tratamento de cold start com apoio do Cluster CC V2 →
            Agregação/build-up por rota →
            Explicabilidade (XAI) →
            Comparação com processo atual (backtest 3 meses com Customer Clustering e Portfolio Segmentation)
          model: >-
            ARIMA/SARIMA como hipótese inicial de forecast, submetida a backtest
            contra a média simples utilizada como baseline. O conceito
            "bottom-up" representa a estratégia de construção/agregação das metas,
            não o algoritmo de forecast isoladamente.
          target: "Potencial/meta de venda (Volume / Net Sales) por PDV ou rota"
          observation_window: "Backtest retroativo de 3 meses"
          prediction_window: "Próximo ciclo de cascateamento"
          main_features: ["Histórico de venda por rota", "Cluster", "Affinity", "Propensity", "Quantity"]
          validation_strategy: "Backtest retroativo de 3 meses com teste A/B entre resultados sales adan vs. Média Simples"
          calibration_method: "Não disponível"
          postprocessing_rules: "Não disponível"
          retraining_frequency: "Não disponível"
        output_table:
          name: "Tabela de metas (exemplo de schema)"
          unity_catalog_path: "Não disponível neste documento"
          columns:
            - {name: COD_DIV, type: string, description: "Código da divisão", example: "DIV_01"}
            - {name: COD_EQ, type: string, description: "Código da equipe/rota", example: "EQ_1234"}
            - {name: CLASSE_CLIENTE, type: string, description: "Classe do cliente", example: "A"}
            - {name: SUBMARCA, type: string, description: "Submarca", example: "ELMA"}
            - {name: META_VOL_GROSS, type: decimal, description: "Meta de volume bruto", example: "1250.0"}
            - {name: META_NS_NET, type: decimal, description: "Meta de Net Sales líquido", example: "48500.00"}
        technical_metrics:
          model_performance: ["Não disponível"]
          coverage: "Não disponível (pré-piloto)"
          operational_quality: "0% das cargas com validação automática hoje — meta é chegar a 100% (Data Contracts)"
