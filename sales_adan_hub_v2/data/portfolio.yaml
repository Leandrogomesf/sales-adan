          validation_strategy: "Check de cobertura do join (meta ≥ 90% dos ProductCode)"
          calibration_method: >-
            Fallback por bin de afinidade: quantidade ausente = baseline 5;
            desconto e dificuldade ausentes = derivados de 5 bins de afinidade
            do PDV (maior afinidade → menor desconto/dificuldade)
