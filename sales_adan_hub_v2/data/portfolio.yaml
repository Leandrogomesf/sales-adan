# Fonte única de verdade do portfólio Sales ADAN.
# Cada produto tem UMA fase ADAN (phase, enum de components/status.py::PHASE_ORDER)
# e UM status operacional (operational_status: Live | Test | WIP | Discovery).
# Algoritmos ficam aninhados dentro do produto — não há mais arquivo separado
# de algoritmos nem tags de fase divergentes por camada.
#
# Decisões de reconciliação desta migração (ver auditoria v2 — achados A1/A2/A3):
#   - Metas (Target Intelligence): PoC (segue o catálogo antigo, não o texto do algoritmo)
#   - Portfólio Prioritário: MVP (segue o catálogo antigo, não o roadmap antigo)
#   - Customer Clustering: status operacional Live (segue o algoritmo, não a tag antiga)

products:
  - id: customer-clustering
    name: Customer Clustering and Personas
    code: "CC 1.0"
    phase: sustain
    operational_status: Live
    module: Cliente
    consuming_areas: [Trade, CRM, Growth, Sales, Marketing]
    business_owner: Victor Vidal (PO)
    technical_owner: Leonardo Damasio (DS Lead)
    description: >-
      Segmenta os PDVs da PepsiCo Brasil em clusters comportamentais e
      personas acionáveis, combinando histórico de vendas, recência, canal
      digital, inovação e afinidade de marca.
    business_objective: >-
      Responder "quem são meus clientes?" para permitir ações comerciais e
      de marketing diferenciadas por perfil de PDV, alimentando os modelos
      de Portfolio Segmentation.
    tables:
      - "Feature Store (uc_dev_latam_mdip_01.pbf_digitalsales_datascience.fs_cust_cluster_new)"
      - "Cluster predictions (uc_dev_latam_mdip_01.pbf_digitalsales_datascience.cust_cluster_predictions)"
      - "Histórico predictions (uc_dev_latam_mdip_01.pbf_digitalsales_datascience.cust_cluster_classification_history)"
      - "Sales ADAN predictions (uc_dev_latam_mdip_01.pbf_digitalsales_datascience.sales_adan_predictions)"
    consumption: [Sales Intell Dashboard, Databricks SQL, Input para outros modelos]
    source_docs:
      - "Não Disponível"
    algorithms:
      - id: clustering-kmeans
        name: Customer Clustering (KMeans)
        operational_status: Live
        phase_since: "2026-01"
        last_run: "2026-08-21"
        last_training: "2026-04-24"
        registered_model:
          name: "ml_model_customer_clustering"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.ml_model_customer_clustering"
          champion_version: 10
          challenger_version: 11
          latest_version: 11
        functional:
          problem_solved: >-
            Segmenta os PDVs em grupos comportamentais homogêneos a partir de
            características de vendas, frequência e recência de compra, adoção
            do canal digital, inovação e afinidade com famílias de marca.
          decision_supported: >-
            Identificar qual persona/cluster melhor representa cada PDV, apoiando
            a diferenciação de campanhas, abordagens comerciais, comunicação e
            estratégias de desenvolvimento do cliente.
          users: [CRM, Trade Marketing, Marketing, Sales]
          granularity: "PDV (customer_id)"
          update_frequency: "Mensal"
          plain_explanation: >-
            O modelo analisa PDVs com comportamentos semelhantes e os organiza em
            5 grupos. Para isso, considera informações como vendas, frequência de
            pedidos, uso do canal digital, inovação e afinidade com marcas.
            Cada cluster é posteriormente representado por uma persona para tornar
            a segmentação mais simples de interpretar e utilizar pelo negócio.
          known_limitations: >-
            O número de clusters é fixado em 5 por decisão conjunta entre negócio
            e Data Science. Dessa forma, o modelo não altera automaticamente a
            quantidade de segmentos caso ocorram mudanças estruturais importantes
            no comportamento da base. Mudanças relevantes na população ou no perfil
            dos PDVs podem exigir nova avaliação do KMeans, das features, das
            personas e da estratégia de segmentação.
        technical:
          pipeline: >-
            Feature Store → Preparação dos dados e tratamento de outliers →
            Padronização das variáveis → PCA (90% da variância) →
            Clusterização (KMeans, k=5) → Atribuição inicial dos clusters →
            Classificação operacional de PDVs via Regressão Logística →
            Tabela de output
          model: >-
            KMeans para definição da estrutura original de clusters +
            Regressão Logística Multinomial como modelo Champion para
            classificação operacional de PDVs nos clusters definidos.
          model_diagram: "1_kmeans.png"
          target: "Atribuição de cluster (1 a 5)"
          observation_window: "12 meses"
          prediction_window: "Não aplicável (classificação, não previsão temporal)"
          main_features:
            - "TotSales12m — Total de Vendas (12 meses)"
            - "NPedidos12m — Número de Pedidos (12 meses)"
            - "AvgSales12m — Ticket Médio (12 meses)"
            - "RecenPep — Recência de Compra PepsiCo"
            - "RecenBees — Recência no Bees"
            - "PercNSalesBees12m — % de Vendas via Bees"
            - "QtdInov12 / PenInov12 — Quantidade e Penetração de Inovação"
            - "VolMarcaFam_[Marca]12m — Afinidade por família de marca"
          validation_strategy: "Não disponível"
          calibration_method: "Escalonamento via StandardScaler (média 0, variância 1)"
          postprocessing_rules: "Filtro de variância constante (threshold 0.8) e redutor de colinearidade (Pearson > 0.7)"
          retraining_frequency: "Não disponível"
        output_table:
          name: "cust_cluster_predictions"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.cust_cluster_predictions"
          execution_date_column: reference_date
          columns:
            - {name: CustomerId, type: string, description: "Identificador do PDV", example: "100023517"}
            - {name: cluster, type: int, description: "Cluster atribuído pelo KMeans", example: "0"}
            - {name: reference_date, type: date, description: "Data de referência das features", example: "2026-04-24"}
            - {name: TotSales12m, type: double, description: "Total de vendas (12 meses)", example: "13444.71"}
            - {name: NPedidos12m, type: double, description: "Número de pedidos (12 meses)", example: "34.0"}
            - {name: RecenPep, type: int, description: "Recência de compra PepsiCo (dias)", example: "10"}
            - {name: PercNSalesBees12m, type: double, description: "% de vendas via BEES (12 meses)", example: "0.77"}
            - {name: QtdInov12, type: double, description: "Quantidade de produtos de inovação (12 meses)", example: "23.0"}
            - {name: PercPedIno, type: double, description: "% de pedidos com inovação", example: "0.35"}
            - {name: PercCompChall12m, type: double, description: "% de desafios concluídos (12 meses)", example: "0.25"}
            - {name: PercVisitasRealizadas, type: double, description: "% de visitas realizadas", example: "0.48"}
            - {name: VolMarcaFam_RUFFLES12m, type: double, description: "Share de volume da família RUFFLES (12 meses)", example: "0.078"}
            - {name: VolMarcaFam_CHEETOS12m, type: double, description: "Share de volume da família CHEETOS (12 meses)", example: "0.118"}
            - {name: VolMarcaFam_DORITOS12m, type: double, description: "Share de volume da família DORITOS (12 meses)", example: "0.112"}
            - {name: VolMarcaFam_LAYS12m, type: double, description: "Share de volume da família LAYS (12 meses)", example: "0.026"}
        technical_metrics:
          model_performance:
            - "Algoritmo de clusterização: KMeans, k=5"
            - "Algoritmo de classificação: Regressão Logística Multinomial"
          coverage: "Não disponível neste documento"
          operational_quality: "Pipeline mensal via Databricks; artefatos versionados no Unity Catalog"
          drift_stability: "Não disponível neste documento"
        business_value:
          note: >-
            Ver resultados consolidados do piloto CC V2 (Fev-Abr 2026) na tela
            de Testes e Resultados — métricas de VMD, adoção digital e tarefas
            efetivadas vs. grupo controle.
          metrics: ["Net Sales incremental", "VMD vs. controle", "Adoção digital", "Tarefas efetivadas"]

      - id: classification-logreg
        name: Customer Classification (Regressão Logística)
        operational_status: Live
        phase_since: "2026-01"
        last_run: "2026-11-17"
        last_training: "2026-06-30"
        registered_model:
          name: "ml_model_customer_classification"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.ml_model_customer_classification"
          champion_version: 1
          challenger_version: 1
          latest_version: 1
        functional:
          problem_solved: >-
            Operacionaliza a atribuição de PDVs aos 5 clusters definidos pelo
            Customer Clustering, evitando a necessidade de executar novamente
            toda a etapa de clusterização sempre que uma classificação precisar
            ser realizada.
          decision_supported: >-
            Em qual persona/cluster definido pelo Customer Clustering um PDV
            deve ser classificado com base em suas características atuais.
          users: [CRM, Trade Marketing, Marketing]
          granularity: "PDV (customer_id)"
          update_frequency: "Mensal"
          plain_explanation: >-
            O KMeans é utilizado para construir os 5 grupos originais. Depois
            que esses grupos estão definidos, a Regressão Logística aprende as
            características associadas a cada cluster e permite classificar PDVs
            de forma mais simples e operacional, sem precisar reconstruir toda
            a segmentação a cada execução.
          known_limitations: >-
            A Regressão Logística reproduz a estrutura de clusters previamente
            definida pelo Customer Clustering e, portanto, depende da qualidade
            e atualidade dessa segmentação. Caso o comportamento da população
            mude de forma relevante, pode ser necessário reavaliar primeiro os
            clusters de origem. A escolha do modelo Champion prioriza
            interpretabilidade, simplicidade operacional e eficiência.
        technical:
          pipeline: >-
            Feature Store tratada → Aplicação das mesmas transformações relevantes
            do Customer Clustering → Regressão Logística Multinomial →
            Predição de cluster → Tabela de classificação
          model: "Regressão Logística Multinomial (Champion)"
          model_diagram: "2_regressao_logistica.png"
          target: "Cluster definido pelo Customer Clustering (1 a 5)"
          observation_window: "12 meses"
          prediction_window: "Não aplicável"
          main_features: ["Mesmas features do Customer Clustering (ver clustering-kmeans)"]
          validation_strategy: "Não disponível"
          calibration_method: "StandardScaler"
          postprocessing_rules: "Linhagem imutável com a Feature Store via FeatureLookup"
          retraining_frequency: "Não disponível"
        output_table:
          name: "cust_cluster_classification_history"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.cust_cluster_classification_history"
          execution_date_column: execution_date
          columns:
            - {name: CustomerId, type: string, description: "Identificador do PDV", example: "100023345"}
            - {name: predicted_cluster, type: double, description: "Cluster predito pela Regressão Logística", example: "0.0"}
            - {name: model_version, type: int, description: "Versão do modelo registrado", example: "1"}
            - {name: training_run_id, type: string, description: "ID do run MLflow de treino", example: "362e2eaaf0744012bd2aa1ac6d4499e5"}
            - {name: reference_date, type: date, description: "Data de referência da classificação", example: "2026-10-16"}
            - {name: execution_date, type: timestamp, description: "Data e hora da execução", example: "2026-10-16 23:26:24"}
        technical_metrics:
          model_performance: ["Não disponível neste documento"]
          coverage: "Não disponível neste documento"
          operational_quality: "Código produtivo em módulos .py, seguindo princípios de IA Responsável da PepsiCo"
          drift_stability: "Não disponível neste documento"
        business_value:
          note: "Ver resultados consolidados do piloto CC V2 na tela de Testes e Resultados."
          metrics: ["Net Sales incremental", "Produtividade"]

      - id: personas
        name: Personas de PDV
        operational_status: Live
        last_run: "Não aplicável (tradução de negócio, não roda periodicamente)"
        last_training: "Não aplicável"
        reference_doc: "personas/Personas Pepsico_2906_v2.pdf"
        overview_image: "personas/resumo_personas_jpeg.jpeg"
        personas:
          - cluster: 0
            name: "Túlio Topa-Tudo"
            avatar: "personas/avatar_tulio_0.png"
            card_image: "personas/card_persona_0_jpeg.jpeg"
            share_of_customers: "19%"
            avg_annual_ticket: "R$ 20.729"
            net_sales_share: "44%"
            main_pdv_type: "Pequenos/médios mercados"
            route_type: "DTS Trad/Van Sales"
            description: >-
              Túlio é um parceiro próximo e confiável, que mantém o negócio
              sempre abastecido. Compra com frequência, em volumes mais altos
              que os demais clusters e com consistência ao longo do tempo. Está
              presente tanto no digital quanto no relacionamento com o time de
              vendas. É estratégico e valioso para o desempenho porque lidera
              as vendas de inovação, mantém recorrência e representa a maior
              parte do faturamento da companhia.
            ratings:
              - {label: "% Faturamento PepsiCo", value: 4}
              - {label: "% Pedidos", value: 3}
              - {label: "% Repres. Vendas (BEES)", value: 3}
              - {label: "% Participação em Loyalty", value: 2}
              - {label: "Recência*", value: 5}
              - {label: "Inovação", value: 5}
            brand_mix: ["Doritos 17%", "Cheetos 16%", "Ruffles 7%", "Lay's 3%"]
            traits: ["Alto volume", "Ativo no digital", "Boa recorrência", "Líder em Inovação"]

          - cluster: 1
            name: "Cláudia Cautelosa"
            avatar: "personas/avatar_claudia_1.png"
            card_image: "personas/card_persona_1_jpeg.jpeg"
            share_of_customers: "16%"
            avg_annual_ticket: "R$ 2.589"
            net_sales_share: "4%"
            main_pdv_type: "Bares"
            route_type: "DTS Trad/Van Sales"
            description: >-
              Cláudia é uma compradora pouco ativa. Demora para recomprar, tem
              pouca proximidade com o digital e raramente participa de ações ou
              desafios. Também não costuma arriscar em novidades, mantendo um
              portfólio mais básico e conhecido. Sua relação com a marca está
              mais distante e pontual, podendo representar um risco de churn.
            ratings:
              - {label: "% Faturamento PepsiCo", value: 1}
              - {label: "% Pedidos", value: 1}
              - {label: "% Repres. Vendas (BEES)", value: 2}
              - {label: "% Participação em Loyalty", value: 1}
              - {label: "Recência*", value: 1}
              - {label: "Inovação", value: 1}
            brand_mix: ["Cheetos 20%", "Doritos 17%", "Ruffles 10%", "Lay's 3%"]
            traits: ["Baixo volume", "Distante no digital", "Compra pontual", "Risco de churn"]

          - cluster: 2
            name: "Bruno Básico"
            avatar: "personas/avatar_bruno_2.png"
            card_image: "personas/card_persona_2_jpeg.jpeg"
            share_of_customers: "25%"
            avg_annual_ticket: "R$ 7.282"
            net_sales_share: "20%"
            main_pdv_type: "Farmácias"
            route_type: "DTS Trad/Van Sales"
            description: >-
              Bruno compra com alta frequência, mas em volumes menores. As 4
              principais marcas representam a maior parte de suas compras
              PepsiCo, mas opera com baixa intensidade e pouca digitalização.
              Costuma apostar em produtos já conhecidos do seu público, com
              pouca adesão a inovações e tem a menor participação em ações de
              loyalty. É bem atendido pela equipe de vendas e depende das
              visitas DTS para seu giro de pedidos.
            ratings:
              - {label: "% Faturamento PepsiCo", value: 2}
              - {label: "% Pedidos", value: 2}
              - {label: "% Repres. Vendas (BEES)", value: 2}
              - {label: "% Participação em Loyalty", value: 1}
              - {label: "Recência*", value: 4}
              - {label: "Inovação", value: 1}
            brand_mix: ["Cheetos 23%", "Doritos 20%", "Ruffles 13%", "Lay's 3%"]
            traits: ["Volume médio", "Baixa digitalização", "Alta recorrência", "Mais do mesmo"]

          - cluster: 3
            name: "Paty Parceria"
            avatar: "personas/avatar_paty_3.png"
            card_image: "personas/card_persona_3_jpeg.jpeg"
            share_of_customers: "20%"
            avg_annual_ticket: "R$ 7.069"
            net_sales_share: "15%"
            main_pdv_type: "Padarias"
            route_type: "Pré-venda"
            description: >-
              Paty tem uma relação próxima com o time de vendas e está presente
              no dia a dia da companhia. Compra com certa frequência e já
              utiliza o digital, mas ainda apresenta baixo ticket. Costuma
              repetir produtos já conhecidos, explora pouco as inovações e não
              tem snacks como seu foco principal. É um cliente engajado no
              relacionamento, mas com espaço para evoluir e diversificar suas
              compras.
            ratings:
              - {label: "% Faturamento PepsiCo", value: 2}
              - {label: "% Pedidos", value: 2}
              - {label: "% Repres. Vendas (BEES)", value: 3}
              - {label: "% Participação em Loyalty", value: 1}
              - {label: "Recência*", value: 4}
              - {label: "Inovação", value: 1}
            brand_mix: ["Cheetos 9%", "Doritos 7%", "Ruffles 5%", "Lay's 2%"]
            traits: ["Volume médio", "Média digitalização", "Alta recorrência", "Mais do mesmo"]

          - cluster: 4
            name: "Diego Digital"
            avatar: "personas/avatar_diego_4.png"
            card_image: "personas/card_persona_4_jpeg.jpeg"
            share_of_customers: "20%"
            avg_annual_ticket: "R$ 7.453"
            net_sales_share: "16%"
            main_pdv_type: "Bombonieres"
            route_type: "Pré-venda"
            description: >-
              Diego é conectado, participativo e gosta de aproveitar as
              oportunidades. Está presente no digital, interage com campanhas e
              ações de loyalty e responde bem a estímulos da marca. Compra com
              frequência, tem snacks como parte relevante de seus pedidos, e
              mantém uma boa relação com o time de vendas. Ainda tem espaço
              para crescer e pode ser estimulado a apostar mais em inovações.
              Diego demonstra autonomia, depende pouco de visitas presenciais e
              usa o digital para se "auto servir" quando necessário.
            ratings:
              - {label: "% Faturamento PepsiCo", value: 2}
              - {label: "% Pedidos", value: 2}
              - {label: "% Repres. Vendas (BEES)", value: 4}
              - {label: "% Participação em Loyalty", value: 3}
              - {label: "Recência*", value: 4}
              - {label: "Inovação", value: 1}
            brand_mix: ["Cheetos 20%", "Doritos 17%", "Ruffles 11%", "Lay's 4%"]
            traits: ["Volume médio", "Líder no digital", "Alta frequência", "Autossuficiente"]
        functional:
          problem_solved: >-
            Os 5 clusters do Customer Clustering são identificados por números
            (1 a 5), o que dificulta a comunicação e o uso do resultado pelas
            áreas de negócio e marketing no dia a dia.
          decision_supported: >-
            Qual arquétipo de cliente (persona) melhor representa um PDV, para
            orientar tom de comunicação, abordagem comercial e priorização de
            campanhas por perfil.
          users: [CRM, Trade Marketing, Marketing, Sales]
          granularity: "PDV (customer_id) / Cluster"
          update_frequency: "Não aplicável — atualizada junto de revisões do Customer Clustering"
          plain_explanation: >-
            Não é um novo algoritmo, e sim a tradução dos 5 clusters numéricos do
            Customer Clustering em personas com nome, rosto e características de
            negócio — mais fáceis de entender e usar por quem não trabalha com
            dados no dia a dia.
          known_limitations: >-
            As personas herdam todas as limitações do Customer Clustering (k=5
            fixo, dependência de retraining programado) — uma mudança nos
            clusters de origem exige revisão do mapeamento de personas.
        technical:
          pipeline: "Customer Clustering (cluster 1-5) → Mapeamento de negócio (nome, perfil, métricas) → Persona associada ao PDV"
          model: "Não aplicável — camada de tradução de negócio sobre o resultado do Customer Clustering (KMeans)"
          target: "Não aplicável"
          observation_window: "Herdada do Customer Clustering (12 meses)"
          prediction_window: "Não aplicável"
          main_features: ["Cluster atribuído pelo Customer Clustering (ver clustering-kmeans)"]
          validation_strategy: "Não aplicável"
          calibration_method: "Não aplicável"
          postprocessing_rules: >-
            Mapeamento fixo cluster → persona definido em conjunto com Marketing
            (documento "Personas Pepsico_2906_v2").
          retraining_frequency: "Não aplicável"
        output_table:
          name: "Não aplicável — consome a saída do Customer Clustering (cust_cluster_predictions)"
          unity_catalog_path: "Não aplicável"
          columns:
            - {name: cluster, type: int, description: "Cluster de origem (Customer Clustering)", example: "0"}
            - {name: persona_name, type: string, description: "Nome da persona", example: "Túlio Topa-Tudo"}
            - {name: customer_share, type: decimal, description: "% da base de clientes nessa persona", example: "0.19"}
            - {name: avg_annual_ticket, type: decimal, description: "Ticket médio anual (R$)", example: "20729.00"}
            - {name: net_sales_share, type: decimal, description: "% do Net Sales total representado pela persona", example: "0.44"}
            - {name: main_pdv_type, type: string, description: "Tipo de PDV predominante na persona", example: "Pequenos/médios mercados"}
            - {name: main_route_type, type: string, description: "Tipo de rota predominante na persona", example: "DTS Trad/Van Sales"}
        technical_metrics:
          model_performance: ["Não aplicável — camada de tradução de negócio, sem métrica de modelo própria"]
          coverage: "5 personas cobrindo 100% dos clusters do Customer Clustering"
          operational_quality: "Mapeamento estável, revisado junto da governança de Marketing"
          drift_stability: "Acompanha o drift do Customer Clustering de origem"
        business_value:
          note: >-
            As 5 personas documentadas (fonte: "Personas Pepsico_2906_v2.pdf") são:
            Túlio Topa-Tudo (19% da base, ticket médio R$ 20.729, 44% do Net Sales,
            alto volume e inovação, ativo no digital, pequenos/médios mercados,
            rota DTS Trad/Van Sales); Cláudia Cautelosa (16%, R$ 2.589, 4% do NS,
            baixo volume, distante do digital, risco de churn, bares, DTS
            Trad/Van Sales); Bruno Básico (25%, R$ 7.282, 20% do NS, alta
            frequência e volume médio, baixa digitalização, dependente de visitas
            DTS, farmácias, DTS Trad/Van Sales); Paty Parceria (20%, R$ 7.069, 15%
            do NS, relação próxima com vendas, baixo ticket, pouca inovação,
            padarias, Pré-venda); Diego Digital (20%, R$ 7.453, 16% do NS, líder
            digital, alta frequência, autossuficiente, bombonieres, Pré-venda).
          metrics: ["Adoção por área de negócio", "Uso em campanhas de CRM/Marketing"]

  - id: portfolio-segmentation
    name: Portfolio Segmentation
    code: "PS 2.1, 2.2, 2.3, 2.4"
    phase: sustain
    operational_status: Test
    module: Produto
    consuming_areas: [Trade, Growth, Digital Sales, Marketing]
    business_owner: Victor Vidal (PO)
    technical_owner: Leonardo Damasio (DS Lead)
    description: >-
      Identifica oportunidades de expansão de portfólio por cliente e
      produto, combinando score de afinidade (SVD), score de propensão
      (árvore de decisão), quantidade recomendada e faixas de quantidade.
    business_objective: >-
      Priorizar produtos com maior oportunidade de ativação ou crescimento
      em cada PDV, alimentando Tasks e Suggested Order.
    tables:
