      - id: affinity-score-svd
        name: Affinity Score (SVD)
        operational_status: Test
        phase_since: "2026-04"
        last_run: "2026-11-17"
        last_training: "2026-11-17"
        registered_model:
          name: "ml_model_affinity_score"
          unity_catalog_path: "uc_dev_latam_mdip_01.pbf_digitalsales_datascience.ml_model_affinity_score"
          champion_version: 77
          challenger_version: 34
          latest_version: 77
        functional:
          problem_solved: >-
            Estima o grau de afinidade entre um PDV e um produto a partir do
            comportamento histórico de compra, ajudando a identificar itens
            aderentes ao perfil de consumo do cliente mesmo quando eles não
            aparecem de forma evidente em regras comerciais simples.
          decision_supported: >-
            Quais produtos apresentam maior aderência ao perfil de compra de cada
            PDV e, portanto, devem ser considerados como candidatos à expansão
            de mix e à priorização comercial.
          users: [Trade, Growth, Digital Sales]
          granularity: "Cliente-Produto (ProductCombinedCode)"
          update_frequency: "Não disponível"
          plain_explanation: >-
            O modelo transforma o histórico de compras de clientes e produtos em
            representações numéricas. Ao comparar essas representações, identifica
            quais produtos são mais compatíveis com o padrão de consumo de cada
            PDV. O Affinity responde principalmente à pergunta: "quanto este
            produto combina com o perfil deste cliente?"
          known_limitations: >-
            Nesta versão, o treinamento utiliza exclusivamente o recorte
            Business Unit = Salty, ProductCategory IN (Elma, Lucky) e
            IsActive = True. Portanto, os resultados e métricas observados não
            devem ser automaticamente generalizados para outras unidades de
            negócio, categorias ou populações sem nova validação.
        technical:
          pipeline: >-
            Feature Store → Filtro de população (Salty / Elma, Lucky / ativos) →
            Construção da matriz cliente-produto → Fatoração de Matrizes (SVD) →
            Embeddings/representações latentes → Cálculo do Affinity Score →
            Ranking/recomendações → Disponibilização para componentes downstream
          model: "SVD 3.3 (Singular Value Decomposition) — modelo campeão no experimento documentado"
          model_diagram: "3_svd_afinidade.png"
          target: "Score de afinidade cliente-produto"
          observation_window: "Não disponível"
          prediction_window: "Não aplicável"
          main_features:
            - "ProductCombinedCode (produto agrupado, não SKU — neutraliza mudanças de gramatura/PackPricing)"
            - "Volume de compra (não binário — captura intensidade da preferência)"
          validation_strategy: "Comparação entre SVD 3.3, ALS 5.2 e NMF 4.2"
          calibration_method: "Não disponível"
          postprocessing_rules: "Embeddings salvos como entrada estável para o modelo de propensão (Camada 2)"
          retraining_frequency: "Não disponível"
        output_table:
