            - {name: ProductCode, type: string, description: "Código do produto", example: "041_005_37_05"}
            - {name: ProductInfo, type: string, description: "Descrição do produto", example: "RUFFLES BBQ PRA GENTE BAG"}
            - {name: PropensityScore, type: double, description: "Probabilidade estimada de compra", example: "0.46"}
            - {name: PropensityQuantile, type: int, description: "Quantil do score de propensão", example: "5"}
