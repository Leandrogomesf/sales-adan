        functional:
          problem_solved: >-
            Converte diferentes sinais analíticos em uma lista priorizada de
            oportunidades de produto para cada PDV, ajudando o vendedor a decidir
            onde concentrar sua abordagem comercial.
          decision_supported: >-
            Quais produtos devem ser priorizados para cada PDV e em qual ordem,
            servindo também como insumo para geração/distribuição de tasks.
          users: [Sales, Trade, DTS]
          granularity: "PDV x Produto"
          update_frequency: "Não disponível"
          plain_explanation: >-
            O Portfólio Prioritário reúne diferentes sinais do Sales ADAN,
            incluindo Momentum, Affinity e Propensity, para ordenar oportunidades
            de produto para cada PDV. Depois do cálculo, regras operacionais evitam
            concentração excessiva das primeiras posições em uma única marca e
            complementam informações ausentes quando necessário.
          known_limitations: >-
            Na validação mais recente documentada, o componente de Momentum
            apresentou 0% de cobertura devido a incompatibilidade de chave no join
            (ProductFk utilizado como ProductCode). A correção e nova validação
            da cobertura são pré-requisitos para interpretar de forma adequada
            os resultados do piloto 100% algorítmico.
        technical:
          pipeline: >-
            salespbf + products + affinity_score_predictions →
            Join/cálculo de Momentum via ProductCode →
            Integração dos sinais Momentum + Affinity + PropensityScore →
            Cálculo do Score_Base / ranking →
            Agregação e regras de diversidade por marca →
            Fallbacks de atributos operacionais →
            portfolio_priority_score
          model: >-
            Score composto baseado em múltiplos sinais analíticos
            (Momentum + Affinity Score + Propensity Score), complementado por
            regras de negócio e pós-processamento. Não representa um único
            modelo independente de Machine Learning.
          target: "Ranking de até 20 oportunidades de produto por PDV (priority_rank)"
