name: Sales ADAN
tagline: >-
  Inteligência de dados e machine learning para orientar oportunidades,
  recomendações e ações comerciais nos PDVs da PepsiCo Brasil.
last_updated: "2026-11-10"

objective: >-
  Tornar o Customer Intelligence a principal fonte de inteligência comercial
  dos times de vendas e marketing da PepsiCo Brasil, gerando crescimento de
  portfólio e personalização de ações nos PDVs.

description: >-
  O Sales ADAN transforma dados, modelos analíticos e sinais comerciais em
  produtos de dados consumíveis pelo negócio. A iniciativa busca identificar
  quem é o cliente, estimar seu potencial de compra, recomendar produtos e
  quantidades e direcionar a melhor ação comercial para cada PDV.

executive_cards:
  - label: Objetivo
    value: Aumentar Net Sales e penetração de portfólio por meio de decisões comerciais hiperpersonalizadas
  - label: Público impactado
    value: Trade, Vendas, CRM, Digital Sales, Marketing, Growth/Analytics
  - label: Produtos ativos
    value: 5 produtos em MVP Roll-out ou Discovery
  - label: Última atualização
    value: "10/11/2026"

impacted_areas:
  - CRM
  - Trade Marketing
  - Digital Sales
  - Marketing
  - Sales (equipe comercial)
  - Growth / Analytics

