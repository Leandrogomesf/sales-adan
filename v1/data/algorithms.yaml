  # ---------------------------------------------------------------
  - id: goals-potential-model
    name: Modelo de Potencial de PDV (Build-up Bottom-up)
    product_id: target-intelligence
    status: "Discovery — hipótese em backtest (H1)"
    phase: discovery
    last_run: "Não disponível (ainda não produtivo)"
    last_training: "Não disponível"

    functional:
      problem_solved: >-
        Hoje o split de metas comerciais é calculado por média simples e
        distribuído manualmente via planilhas, com atrasos recorrentes e
        baixa acurácia para rotas voláteis ou novas.
      decision_supported: >-
        Qual meta de venda atribuir a cada PDV/rota, a partir do potencial
        real de compra, em vez de uma distribuição top-down genérica.
      users: ["Gestor DTS", "Vendedor DTS/OT", "Time de Sales Intelligence"]
      granularity: "PDV / Rota"
      update_frequency: "Ciclo de cascateamento (OT: 6 meses | DTS: 3 meses + sazonalidade 70/30)"
      plain_explanation: >-
        Em vez de dividir a meta da empresa igualmente entre os vendedores
        (de cima para baixo), o modelo olha o potencial real de cada PDV
        (histórico, cluster, comportamento) e monta a meta de baixo para
        cima — de forma que ela reflita melhor a realidade de cada rota.
      known_limitations: >-
        V1 explicitamente NÃO automatiza o processo de cascateamento atual
        — roda em paralelo (champion-challenger) ao processo manual
        existente, sem substituí-lo ainda.

    technical:
      pipeline: "Data Contracts (schema+owner+SLA por fonte) → Modelo ARIMA/SARIMA (hipótese H1) → Cold start via cluster CC V2 → Explicabilidade (XAI) → Meta por rota"
      model: "ARIMA/SARIMA em backtest contra média simples (modelo atual) — hipótese H1, decisão go/no-go em Set/2026"
      target: "Meta de venda (volume/NS) por PDV ou rota"
      observation_window: "Backtest retroativo de 6 meses"
      prediction_window: "Próximo ciclo de cascateamento"
      main_features: ["Histórico de venda por rota", "Cluster CC V2 (para cold start de rotas sem histórico)"]
      validation_strategy: "Backtest retroativo de 6 meses comparando ARIMA/SARIMA vs. média simples"
      calibration_method: "Não disponível"
      postprocessing_rules: "Relatório de explicabilidade (XAI) por rota — após modelo estável"
      retraining_frequency: "Não disponível"

    output_table:
      name: "Tabela de metas (exemplo de schema)"
      unity_catalog_path: "Não disponível neste documento"
      columns:
        - {name: COD_DIV, type: string, description: "Código da divisão", example: "DIV_01"}
        - {name: COD_EQ, type: string, description: "Código da equipe/rota", example: "EQ_1234"}
        - {name: CLASSE_CLIENTE, type: string, description: "Classe do cliente", example: "A"}
        - {name: SUBMARCA, type: string, description: "Submarca", example: "ELMA"}
        - {name: META_VOL_GROSS, type: decimal, description: "Meta de volume bruto", example: "1250.0"}
        - {name: META_NS_NET, type: decimal, description: "Meta de Net Sales líquido", example: "48500.00"}

    technical_metrics:
      model_performance: ["Baseline de MAPE ainda não medido — ação pendente antes do backtest"]
      coverage: "Não disponível (pré-piloto)"
      operational_quality: "0% das cargas com validação automática hoje — meta é chegar a 100% (Data Contracts)"
      drift_stability: "Não aplicável (modelo ainda não produtivo)"

    business_value:
      note: >-
        V1 é champion-challenger, não substituição — valor medido por
        comparação de remuneração variável e SLA de publicação.
      metrics: ["SLA de publicação (dias úteis)", "MAPE por rota", "% de vendedores com remuneração igual/superior ao modelo atual"]

  # ---------------------------------------------------------------
  - id: portfolio-prioritario-score
    name: Portfólio Prioritário (Score Composto)
    product_id: portfolio-prioritario
    status: "Piloto — correção em curso"
    phase: pilot
    last_run: "Não disponível"
    last_training: "Não disponível"

    functional:
      problem_solved: >-
        Define, para cada PDV, quais produtos e em qual ordem devem ser
        ofertados pelo vendedor, combinando momentum de venda, afinidade e
        propensão em um único ranking.
      decision_supported: "Quais ofertas e tasks distribuir a cada vendedor, por PDV."
      users: [Sales, Trade, DTS]
      granularity: "PDV x Produto"
      update_frequency: "Não disponível"
      plain_explanation: >-
        O modelo soma três sinais — se o produto está em alta recente
        (Momentum), se combina com o perfil do PDV (Affinity) e se há
        chance real de compra (Propensity) — para montar uma lista
        ordenada de até 20 produtos por PDV, evitando repetir demais a
        mesma marca nas primeiras posições.
      known_limitations: >-
        Na validação mais recente, o Momentum tinha 0% de cobertura por um
        bug de join (ProductFk usado como se fosse ProductCode) — correção
        é pré-requisito para o piloto 100% algorítmico ser válido.

    technical:
      pipeline: "salespbf + products + affinity_score_predictions → Join de Momentum (via ProductCode) → Score_Base + Affinity + PropensityScore → Agregação por marca (top 20) → Fallbacks (quantidade/desconto/dificuldade) → portfolio_prioritario_score"
      model: "Score composto (Momentum + Affinity Score + Propensity Score), não um único modelo de ML"
      target: "Ranking de até 20 produtos por PDV (priority_rank)"
      observation_window: "Não disponível"
      prediction_window: "Não disponível"
      main_features: ["Momentum (via ProductCode)", "Affinity Score (de PS 2.2)", "PropensityScore (de PS 2.1)"]
      validation_strategy: "Check de cobertura do join (meta ≥ 90% dos ProductCode)"
      calibration_method: >-
        Fallback por bin de afinidade: quantidade ausente = baseline 5;
        desconto e dificuldade ausentes = derivados de 5 bins de afinidade
        do PDV (maior afinidade → menor desconto/dificuldade)
      postprocessing_rules: >-
        Mesma marca em posições 1-12 é agregada (nome concatenado,
        quantidade somada); marca pode reaparecer no máximo 1x adicional
        nas posições 13-20
      retraining_frequency: "Não disponível"

    output_table:
      name: "portfolio_prioritario_score / algotasking_portfolio_model"
      unity_catalog_path: "Não disponível neste documento"
      columns:
        - {name: vendor_account_id, type: string, description: "Identificador do vendedor", example: "VEND_0456"}
        - {name: sku, type: string, description: "Produto recomendado", example: "CEBOLITOS 90G"}
        - {name: priority_rank, type: int, description: "Posição no ranking (1-20)", example: "4"}
        - {name: qty_recommended, type: decimal, description: "Quantidade recomendada", example: "12.0"}
        - {name: revenue_recommended, type: decimal, description: "Receita recomendada", example: "187.50"}
        - {name: Score_Base, type: decimal, description: "Score base do ranking", example: "0.81"}

    technical_metrics:
      model_performance: ["Cobertura do join de Momentum: meta ≥ 90% (0% na última validação, correção em curso)"]
