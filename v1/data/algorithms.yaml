algorithms:
  # ---------------------------------------------------------------
  - id: clustering-kmeans
    name: Customer Clustering (KMeans)
    product_id: customer-clustering
    status: "Produção"
    phase: sustain
    last_run: "Mensal"
    last_training: "Não disponível"

    functional:
      problem_solved: >-
        Segmenta os PDVs em grupos comportamentais homogêneos a partir de
        vendas, recência, canal digital, inovação e afinidade de marca.
      decision_supported: >-
        Qual persona/cluster representa este PDV, para orientar tom e
        ambição de campanhas comerciais.
      users: [CRM, Trade Marketing, Marketing, Sales]
      granularity: "PDV (customer_id)"
      update_frequency: "Mensal"
      plain_explanation: >-
        O modelo agrupa PDVs parecidos entre si (em vendas, frequência de
        pedido, uso do canal digital e abertura a inovação) em 5 clusters,
        e dá um nome de persona a cada grupo para facilitar a comunicação
        com o negócio.
      known_limitations: >-
        K fixado em 5 por decisão conjunta negócio/DS — não se adapta
        automaticamente caso o comportamento dos PDVs mude de forma
        estrutural; depende de retraining programado para refletir novas
        tendências.

    technical:
      pipeline: "Feature Store → Preparação e tratamento de outliers → PCA (90% variância) → KMeans (k=5) → Classificação de novos PDVs (Regressão Logística) → Tabela de output"
      model: "KMeans (clusterização original) + Regressão Logística Multinomial (classificação de novos PDVs — modelo Champion)"
      target: "Atribuição de cluster (1 a 5)"
      observation_window: "12 meses"
      prediction_window: "Não aplicável (classificação, não previsão temporal)"
      main_features:
        - "TotSales12m — Total de Vendas (12 meses)"
        - "NPedidos12m — Número de Pedidos (12 meses)"
        - "AvgSales12m — Ticket Médio (12 meses)"
        - "RecenPep — Recência de Compra PepsiCo"
        - "RecenBees — Recência no Bees"
        - "PercNSalesBees12m — % de Vendas via Bees"
        - "QtdInov12 / PenInov12 — Quantidade e Penetração de Inovação"
        - "VolMarcaFam_[Marca]12m — Afinidade por família de marca"
      validation_strategy: "Não disponível"
      calibration_method: "Escalonamento via StandardScaler (média 0, variância 1)"
      postprocessing_rules: "Filtro de variância constante (threshold 0.8) e redutor de colinearidade (Pearson > 0.7)"
      retraining_frequency: "Não disponível"

    output_table:
      name: "cust_cluster_classification_snapshot / history"
      unity_catalog_path: "uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.cust_cluster_classification_snapshot"
      columns:
        - {name: customer_id, type: string, description: "Identificador do PDV", example: "PDV_000123"}
        - {name: cluster, type: int, description: "Cluster atribuído (1-5)", example: "3"}
        - {name: persona_name, type: string, description: "Nome da persona do cluster", example: "Túlio"}
        - {name: reference_date, type: date, description: "Data de referência do snapshot", example: "2026-11-01"}
        - {name: model_version, type: string, description: "Versão do modelo", example: "v2.5"}

    technical_metrics:
      model_performance:
        - "Algoritmo de clusterização: KMeans, k=5"
        - "Algoritmo de classificação: Regressão Logística Multinomial"
      coverage: "Não disponível neste documento"
      operational_quality: "Pipeline mensal via Databricks; artefatos versionados no Unity Catalog"
      drift_stability: "Não disponível neste documento"

    business_value:
      note: >-
        Ver resultados consolidados do piloto CC V2 (Fev-Abr 2026) na tela
        de Visão Geral — métricas de VMD, adoção digital e tarefas
        efetivadas vs. grupo controle.
      metrics: ["Net Sales incremental", "VMD vs. controle", "Adoção digital", "Tarefas efetivadas"]

  # ---------------------------------------------------------------
  - id: classification-logreg
    name: Customer Classification (Regressão Logística)
    product_id: customer-clustering
    status: "Produção"
    phase: sustain
    last_run: "Mensal"
    last_training: "Não disponível"

    functional:
      problem_solved: >-
        Classifica novos PDVs (ou PDVs sem cluster vigente) em um dos 5
        clusters definidos pelo modelo de clusterização original, sem
        precisar reprocessar o KMeans completo.
      decision_supported: "Em qual persona/cluster se encaixa um PDV novo ou recém-atualizado."
      users: [CRM, Trade Marketing, Marketing]
      granularity: "PDV (customer_id)"
      update_frequency: "Mensal"
      plain_explanation: >-
        Depois que o KMeans "aprende" os 5 grupos, este modelo mais simples
        decide rapidamente em qual grupo um PDV novo se encaixa, sem
        precisar re-rodar a clusterização inteira todo mês.
      known_limitations: >-
        Modelo Champion fixado como Regressão Logística — decisão de
        governança prioriza transparência/velocidade sobre precisão
        marginal de alternativas mais complexas.

    technical:
      pipeline: "Feature Store tratada → Modelo de Classificação (Regressão Logística) → Predição de cluster → Tabela de output"
      model: "Regressão Logística Multinomial (Champion)"
      target: "Cluster (1 a 5)"
      observation_window: "12 meses"
      prediction_window: "Não aplicável"
      main_features: ["Mesmas features do Customer Clustering (ver clustering-kmeans)"]
      validation_strategy: "Não disponível"
      calibration_method: "StandardScaler"
      postprocessing_rules: "Linhagem imutável com a Feature Store via FeatureLookup"
      retraining_frequency: "Não disponível"

    output_table:
      name: "ml_model_customer_classification (artefato)"
      unity_catalog_path: "uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.ml_model_customer_classification"
      columns:
        - {name: customer_id, type: string, description: "Identificador do PDV", example: "PDV_000456"}
        - {name: predicted_cluster, type: int, description: "Cluster predito", example: "2"}
        - {name: execution_timestamp, type: timestamp, description: "Data e hora da execução", example: "2026-11-01 06:00:00"}

    technical_metrics:
      model_performance: ["Não disponível neste documento"]
      coverage: "Não disponível neste documento"
      operational_quality: "Código produtivo em módulos .py, seguindo princípios de IA Responsável da PepsiCo"
      drift_stability: "Não disponível neste documento"

    business_value:
      note: "Ver resultados consolidados do piloto CC V2 na tela de Visão Geral."
      metrics: ["Net Sales incremental", "Produtividade"]

  # ---------------------------------------------------------------
  - id: affinity-score-svd
    name: Affinity Score (SVD)
    product_id: portfolio-segmentation
    status: "PoC"
    phase: poc
    last_run: "Não disponível"
    last_training: "Não disponível"

    functional:
      problem_solved: "Estima quão aderente um SKU é ao perfil de compra histórico de um PDV."
      decision_supported: "Quais produtos recomendar para expansão de mix em cada PDV."
      users: [Trade, Growth, Digital Sales]
      granularity: "Cliente-Produto (ProductCombinedCode)"
      update_frequency: "Não disponível"
      plain_explanation: >-
        O modelo resume o comportamento de compra de cada PDV em um
        "vetor" numérico (embedding), que é comparado com vetores de
        produtos para estimar a afinidade — sem depender de regras de
        associação tradicionais, que não escalam para 192 mil PDVs.
      known_limitations: >-
        Treinado exclusivamente no recorte Business Unit = Salty,
        ProductCategory IN (Elma, Lucky), IsActive = True — não cobre
        outras unidades de negócio nesta versão.

    technical:
      pipeline: "Feature Store → Filtro (Salty / Elma, Lucky / ativos) → Fatoração de Matrizes (SVD) → Embeddings de produto → Camada 2 (Propensity Score)"
      model: "SVD 3.3 (Singular Value Decomposition) — modelo campeão"
      target: "Score de afinidade cliente-produto"
      observation_window: "Não disponível"
      prediction_window: "Não aplicável"
      main_features:
        - "ProductCombinedCode (produto agrupado, não SKU — neutraliza mudanças de gramatura/PackPricing)"
        - "Volume de compra (não binário — captura intensidade da preferência)"
      validation_strategy: "Comparação entre SVD 3.3, ALS 5.2 e NMF 4.2"
      calibration_method: "Não disponível"
      postprocessing_rules: "Embeddings salvos como entrada estável para o modelo de propensão (Camada 2)"
      retraining_frequency: "Não disponível"

    output_table:
      name: "df_recommendations / df_aff_label / df_rank"
      unity_catalog_path: "Não disponível neste documento"
      columns:
        - {name: customer_id, type: string, description: "Identificador do PDV", example: "PDV_000789"}
        - {name: product_combined_code, type: string, description: "Produto agrupado", example: "DORITOS_NACHO_GRP"}
        - {name: affinity_score, type: decimal, description: "Score estimado de afinidade", example: "0.87"}
        - {name: rank, type: int, description: "Posição no ranking de recomendação", example: "3"}

    technical_metrics:
      model_performance:
        - "Precision@10: 93,89%"
        - "RMSE: 2,71%"
        - "nDCG@10: 98,52%"
      coverage: "Treinado sobre 192 mil PDVs, 138 produtos agrupados"
      operational_quality: "Implementação em Spark, otimizada para esparsidade de matriz"
      drift_stability: "Não disponível neste documento"

    business_value:
      note: "Compõe o Priority Score junto com o Propensity Score."
      metrics: ["Net Sales incremental", "Penetração de portfólio", "Completude de ofertas"]

  # ---------------------------------------------------------------
  - id: propensity-score-tree
    name: Propensity Score (Árvore de Decisão)
    product_id: portfolio-segmentation
    status: "Experimentação"
    phase: poc
    last_run: "Não disponível"
    last_training: "Não disponível"

    functional:
      problem_solved: >-
        Estima a probabilidade de um PDV comprar um determinado produto no
        próximo período.
      decision_supported: >-
        Priorizar oportunidades comerciais por par cliente-produto e
        evitar ruptura de portfólio.
      users: [Trade, Digital Sales, Growth]
      granularity: "Cliente-Produto"
      update_frequency: "Não disponível"
      plain_explanation: >-
        O modelo aprende, a partir do histórico de compras, qual a chance
        de cada PDV comprar cada produto — e explica essa chance de forma
        transparente (é uma árvore de decisão, não uma "caixa-preta"),
        o que facilita auditoria por Marketing e Vendas.
      known_limitations: >-
        Prioriza Recall (capturar o máximo de potencial de venda) em vez
        de Precisão máxima — de cada 3 sugestões, 2 têm alta probabilidade
        de fechamento imediato, mas a terceira pode não converter.

    technical:
      pipeline: "Feature Store → Tratamento de missings e outliers (capping 1%-99%) → RFE / filtro de colinearidade (>0.9) → Balanceamento de classes → Árvore de Decisão → Score final"
      model: "Decision Tree (experimento 2.3 — script v2.3), comparado contra Logistic Regression e Random Forest"
      target: "Probabilidade de compra (0-1) de um SKU por um PDV"
      observation_window: "Até 365 dias (janela de recência)"
      prediction_window: "Próximo período (não especificado em dias neste documento)"
      main_features:
        - "RecenciaProduto (recência de compra do produto)"
        - "NetSales / NetSalesProduto"
        - "Cluster (CC V2) e BairroCode"
      validation_strategy: "Mais de 23 milhões de modelos customizados (combinação PDV x Produto), métricas médias por experimento"
      calibration_method: "Não disponível"
      postprocessing_rules: >-
        Missings de variáveis transacionais tratados como valor máximo da
        janela (nunca comprou); missings categóricos rotulados como
        "Desconhecido"
      retraining_frequency: "Não disponível"

    output_table:
      name: "df_propensity_score"
      unity_catalog_path: "Não disponível neste documento"
      columns:
        - {name: customer_id, type: string, description: "Identificador do PDV", example: "PDV_001122"}
        - {name: propensity_score, type: decimal, description: "Probabilidade estimada de compra", example: "0.74"}
        - {name: propensity_decile, type: int, description: "Decil do score", example: "9"}
        - {name: action_priority, type: string, description: "Prioridade de ação comercial", example: "Prioridade Máxima (Hot Lead)"}

    technical_metrics:
      model_performance:
        - "ROC-AUC: 80,00% (experimento 2.3, selecionado)"
        - "F1-Score: 69,00%"
        - "Precisão: 66,00%"
        - "Recall: 73,00%"
        - "Acurácia: 73,00%"
      coverage: "Scoring individual para 233 mil PDVs"
      operational_quality: "Árvore de decisão escolhida por menor custo de DBU/tempo de inferência vs. Random Forest"
      drift_stability: "Não disponível neste documento"

    business_value:
      note: "Compõe o Priority Score e alimenta diretamente o Portfólio Prioritário (Tasks)."
      metrics: ["Net Sales incremental", "Penetração de portfólio", "Conversão"]

