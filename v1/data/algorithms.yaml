  # ---------------------------------------------------------------
  - id: cross-sell-fpgrowth
    name: Cross-sell (FP-Growth)
    product_id: cross-sell-intelligence
    status: "MVP Roll-out"
    phase: mvp
    last_run: "Não disponível"
    last_training: "Não disponível"

    functional:
      problem_solved: >-
        Identificar quais marcas os clientes compram em conjunto, a partir
        de padrões agregados de comportamento de compra (não recomendações
        individuais por cliente).
      decision_supported: >-
        Quais marcas sugerir em conjunto para expansão de mix e cross-sell,
        nacionalmente ou por estado.
      users: [CRM, Trade, Marketing, "Growth / Analytics"]
      granularity: "Regra de associação entre marcas (nacional ou por estado)"
      update_frequency: "Não disponível neste documento"
      plain_explanation: >-
        O algoritmo analisa o "carrinho de compras" de milhares de clientes
        e descobre padrões do tipo "quem compra a marca X também tende a
        comprar a marca Y" — são padrões agregados de mercado, não uma
        previsão para um cliente específico.
      known_limitations: >-
        Baseado em uma janela de meses recente — não captura sazonalidade
        de longo prazo nem lançamentos novos de produto. Regras com poucos
        clientes na base (`n_customers` baixo, especialmente em estados
        pequenos) são estatisticamente menos robustas.

    technical:
      pipeline: "Histórico de pedidos (SAP/BEES) → Market Basket Analysis → FP-Growth → Regras de associação (nacional e por estado) → Tabelas cross_sell_br / cross_sell_states"
      model: "FP-Growth (market basket analysis)"
      target: "Regras de associação antecedente(s) → consequente(s), com lift > 1 (filtro aplicado na geração)"
      observation_window: "Janela de meses recente (não especificada em dias neste documento)"
      prediction_window: "Não aplicável (padrão agregado, não previsão individual)"
      main_features: ["Marca(s) antecedente(s)", "Marca(s) consequente(s)", "Estado do cliente (CustomerState), na versão por estado"]
      validation_strategy: "Não disponível neste documento"
      calibration_method: >-
        min_support calculado separadamente por estado (min_support_used)
        — compensa a diferença de volume de clientes entre estados
      postprocessing_rules: "Filtro de lift > 1 aplicado na geração dos dados (toda regra publicada já tem associação real, não coincidência)"
      retraining_frequency: "Não disponível"

    output_table:
      name: "cross_sell_br / cross_sell_states"
      unity_catalog_path: "uc_dev_latam_mdip_01.dev_pbf_digitalsales_datascience_sandbox.cross_sell_br"
      columns:
        - {name: antecedents, type: string, description: "Marca(s) de partida da regra", example: "DORITOS"}
        - {name: consequents, type: string, description: "Marca(s) sugerida(s)", example: "RUFFLES"}
        - {name: support, type: decimal, description: "% de clientes que compram ambos, sobre o total da base", example: "0.12"}
        - {name: confidence, type: decimal, description: "De quem compra o antecedente, % que também compra o consequente", example: "0.91"}
        - {name: lift, type: decimal, description: "Quanto a combinação ocorre mais do que o esperado pelo acaso (>1 = associação real)", example: "1.12"}
        - {name: kulczynski, type: decimal, description: "Confidence corrigida para reduzir viés de marcas muito populares", example: "0.78"}
        - {name: certainty, type: decimal, description: "Quão mais confiável a regra é do que simplesmente chutar o consequente", example: "0.55"}
        - {name: CustomerState, type: string, description: "Estado do cliente (somente em cross_sell_states)", example: "SP"}
        - {name: n_customers, type: int, description: "Clientes daquele estado na análise (somente em cross_sell_states) — indicador de robustez", example: "4210"}

    technical_metrics:
      model_performance:
        - "Exemplo real: Doritos → Ruffles, confiança 91%"
        - "Exemplo real: Cheetos → Fandangos, lift 1,12"
        - "Toda regra publicada tem lift > 1 (filtro de geração)"
      coverage: "Nacional (cross_sell_br) e por estado (cross_sell_states, sujeito a min_support por UF)"
      operational_quality: "Estados sem RAC ou com poucos clientes podem não aparecer em cross_sell_states (descartados por não atingirem base mínima)"
      drift_stability: "Não disponível neste documento"

    business_value:
      note: >-
        Regras com n_customers baixo são menos confiáveis — sinalizar isso
        em decisões de negócio, mesmo com lift alto.
      metrics: ["Penetração de portfólio", "Completude de ofertas", "Expansão de mix"]

